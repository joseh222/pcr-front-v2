<div class="app-layout" [class.app-layout-sidebar-collapsed]="sidebarCollapsed()" data-testid="app-shell">
    @if (sidebarOpen()) {
        <button class="sidebar-backdrop" type="button" aria-label="Cerrar menú" data-testid="sidebar-backdrop"
            (click)="closeSidebar()">
        </button>
    }

    <pcr-sidebar [open]="sidebarOpen()" [collapsed]="sidebarCollapsed()" />

    <div class="app-content">
        <pcr-topbar [sidebarCollapsed]="sidebarCollapsed()" (mobileMenuRequested)="toggleSidebar()"
            (desktopMenuRequested)="toggleDesktopSidebar()" />

        <div class="app-page">
            <main class="app-main" data-testid="app-main">
                <router-outlet />

                <section class="welcome-placeholder">
                    <div>
                        <p class="text-sm font-medium text-[var(--mat-sys-primary)]">PCR Front V2</p>
                        <h1 class="mt-1 text-2xl font-semibold">Bienvenido al sistema</h1>
                        <p class="mt-2 text-sm opacity-60">
                            La estructura principal está lista para comenzar a incorporar los módulos.
                        </p>
                    </div>
                </section>
            </main>

            <pcr-footer />
        </div>
    </div>
</div>
